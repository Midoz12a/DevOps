name: Deploy react
on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - run: docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
      - run: docker build -t ahmedgamil/react-test -f Dockerfile.dev .
      - run: docker run -e CI=true ahmedgamil/react-test npm run test
      
      - run: docker build -t midoz22/multi-client ./microservices/client
      - run: docker build -t midoz22/multi-server ./microservices/server
      - run: docker build -t midoz22/multi-nginx ./microservices/nginx
      - run: docker build -t midoz22/multi-worker ./microservices/worker

      - run: docker run midoz22/multi-client
      - run: docker run midoz22/multi-server
      - run: docker run midoz22/multi-nginx
      - run: docker run midoz22/multi-worker 
